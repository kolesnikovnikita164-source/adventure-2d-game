<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div>Leo</div>
        <div>Uhrzeit: <span id="clock">06:00</span></div>
        <div>Aufgaben: <span id="tasks">0/3</span></div>
    </div>

    <div id="interaction">
        <span id="interactionText"></span>
        <button id="interactionButton">Interagieren</button>
    </div>

    <div id="dialog">
        <div id="dialogName"></div>
        <div id="dialogText"></div>
        <button id="dialogNext">Weiter</button>
    </div>

    <div id="mobileControls">
        <button id="up">▲</button>
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
