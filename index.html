<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leo-Lukas – 2D Adventure</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: manipulation;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #101820;
}

/* SPIELWELT */

#world {
    position: absolute;
    width: 1200px;
    height: 700px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background:
        linear-gradient(90deg,
        #526b48 0%,
        #526b48 32%,
        #876d4c 32%,
        #876d4c 68%,
        #526b48 68%);
    border: 8px solid #30271e;
    overflow: hidden;
}

/* Boden */

.floor {
    position: absolute;
    background:
        repeating-linear-gradient(
            45deg,
            #b99b70 0px,
            #b99b70 25px,
            #b39368 25px,
            #b39368 50px
        );
    border: 5px solid #73583d;
}

#house {
    left: 70px;
    top: 60px;
    width: 720px;
    height: 580px;
}

#hall {
    left: 790px;
    top: 60px;
    width: 340px;
    height: 580px;
    background: #847055;
    border: 5px solid #4e4030;
}

/* Räume */

.room {
    position: absolute;
    border: 4px solid #76583d;
}

#bedroom {
    left: 25px;
    top: 25px;
    width: 300px;
    height: 240px;
}

#kitchen {
    left: 330px;
    top: 25px;
    width: 360px;
    height: 240px;
}

#living {
    left: 25px;
    top: 270px;
    width: 665px;
    height: 285px;
}

/* Möbel */

.object {
    position: absolute;
    border-radius: 6px;
    border: 4px solid rgba(0,0,0,.25);
}

/* Bett */

#bed {
    left: 50px;
    top: 60px;
    width: 180px;
    height: 95px;
    background: #536d9b;
}

#bed::after {
    content: "🛏️";
    position: absolute;
    font-size: 48px;
    left: 60px;
    top: 18px;
}

/* Schreibtisch */

#desk {
    left: 30px;
    top: 160px;
    width: 230px;
    height: 55px;
    background: #68482f;
}

#desk::after {
    content: "📚";
    position: absolute;
    right: 15px;
    top: -42px;
    font-size: 32px;
}

/* Küche */

#counter {
    left: 25px;
    top: 25px;
    width: 310px;
    height: 65px;
    background: #656565;
}

#counter::after {
    content: "☕ 🍞";
    font-size: 30px;
    position: absolute;
    left: 30px;
    top: 13px;
}

/* Tisch */

#table {
    left: 105px;
    top: 110px;
    width: 150px;
    height: 100px;
    background: #754b2e;
    border-radius: 50%;
}

#table::after {
    content: "🍽️";
    font-size: 32px;
    position: absolute;
    left: 55px;
    top: 30px;
}

/* Sofa */

#sofa {
    left: 70px;
    top: 55px;
    width: 250px;
    height: 90px;
    background: #59636d;
}

#sofa::after {
    content: "🛋️";
    font-size: 45px;
    position: absolute;
    left: 95px;
    top: 18px;
}

/* Fernseher */

#tv {
    right: 55px;
    top: 40px;
    width: 150px;
    height: 100px;
    background: #222;
    border: 8px solid #3b2c20;
}

#tv::after {
    content: "📺";
    font-size: 45px;
    position: absolute;
    left: 48px;
    top: 18px;
}

/* Haustür */

#door {
    position: absolute;
    right: 20px;
    bottom: 15px;
    width: 70px;
    height: 120px;
    background: #55331f;
    border: 5px solid #342015;
}

#door::after {
    content: "🚪";
    font-size: 45px;
    position: absolute;
    left: 10px;
    top: 30px;
}

/* Mutter */

.npc {
    position: absolute;
    width: 46px;
    height: 62px;
    z-index: 20;
}

#mother {
    left: 485px;
    top: 115px;
}

.character {
    width: 46px;
    height: 46px;
    position: relative;
}

.character .head {
    position: absolute;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #f0bd91;
    left: 9px;
    top: 0;
    border: 2px solid #432d23;
}

.character .hair {
    position: absolute;
    width: 30px;
    height: 14px;
    border-radius: 15px 15px 4px 4px;
    background: #4b2a1d;
    left: 8px;
    top: -3px;
    z-index: 2;
}

.character .body {
    position: absolute;
    width: 36px;
    height: 27px;
    border-radius: 10px 10px 4px 4px;
    background: #8b5872;
    left: 5px;
    top: 25px;
}

#mother .character::after {
    content: "👩";
    position: absolute;
    font-size: 40px;
    left: 3px;
    top: 0;
    opacity: .95;
}

/* Leo */

#player {
    position: absolute;
    width: 46px;
    height: 62px;
    z-index: 30;
}

#player .character::after {
    content: "🧑";
    position: absolute;
    font-size: 40px;
    left: 3px;
    top: 0;
}

/* Fragezeichen */

.interact {
    position: absolute;
    left: 50%;
    top: -35px;
    transform: translateX(-50%);
    background: #ffd84d;
    color: #222;
    border-radius: 50%;
    width: 27px;
    height: 27px;
    text-align: center;
    line-height: 27px;
    font-weight: bold;
    display: none;
    box-shadow: 0 3px 10px #000;
}

.npc.near .interact {
    display: block;
}

/* HUD */

#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 100;
    background: rgba(15,15,20,.9);
    color: white;
    border: 2px solid #777;
    border-radius: 12px;
    padding: 10px 15px;
}

#hud strong {
    color: #ffd84d;
}

/* Dialog */

#dialog {
    position: absolute;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    width: min(850px, calc(100% - 30px));
    background: rgba(15,15,20,.97);
    color: white;
    border: 3px solid #d6b55b;
    border-radius: 15px;
    padding: 20px;
    z-index: 200;
    display: none;
}

#dialogName {
    color: #ffd84d;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 10px;
}

#dialogText {
    line-height: 1.5;
    font-size: 17px;
}

#dialogButton {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: #ffd84d;
    font-weight: bold;
}

/* Steuerung */

#controls {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 150;
    width: 150px;
    height: 150px;
}

.control {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 2px solid white;
    background: rgba(0,0,0,.55);
    color: white;
    border-radius: 12px;
    font-size: 22px;
}

#up {
    left: 50px;
    top: 0;
}

#left {
    left: 0;
    top: 50px;
}

#down {
    left: 50px;
    top: 50px;
}

#right {
    left: 100px;
    top: 50px;
}

#action {
    position: absolute;
    right: 25px;
    bottom: 35px;
    z-index: 150;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 3px solid white;
    background: rgba(180,70,70,.8);
    color: white;
    font-size: 16px;
    font-weight: bold;
}

/* Start */

#startScreen {
    position: absolute;
    inset: 0;
    z-index: 500;
    background:
        linear-gradient(rgba(10,15,20,.75), rgba(10,15,20,.95));
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 20px;
}

.startBox {
    max-width: 600px;
    background: rgba(20,20,25,.95);
    border: 3px solid #d6b55b;
    border-radius: 20px;
    padding: 35px;
}

.startBox h1 {
    color: #ffd84d;
    font-size: 42px;
    margin-top: 0;
}

.startBox button {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #ffd84d;
    font-weight: bold;
    font-size: 18px;
}

/* Mobile */

@media (max-width: 700px) {
    #world {
        transform: translate(-50%, -50%) scale(.75);
    }

    #hud {
        font-size: 13px;
    }

    #dialogText {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="startScreen">
        <div class="startBox">
            <h1>Leo-Lukas</h1>
            <p>
                Ein ganz normaler Morgen?<br><br>
                Oder beginnt heute ein Abenteuer?
            </p>

            <p>
                🎮 <b>PC:</b> WASD oder Pfeiltasten<br>
                📱 <b>Handy:</b> Steuerkreuz<br>
                💬 Nähe dich Personen und drücke AKTION
            </p>

            <button onclick="startGame()">Spiel starten</button>
        </div>
    </div>

    <div id="hud">
        🕕 <strong id="time">06:00</strong>
        &nbsp; | &nbsp;
        ❤️ Motivation: <strong id="motivation">50</strong>
    </div>

    <div id="world">

        <div id="house" class="floor">

            <div id="bedroom" class="room">
                <div id="bed" class="object"></div>
                <div id="desk" class="object"></div>
            </div>

            <div id="kitchen" class="room">
                <div id="counter" class="object"></div>
                <div id="table" class="object"></div>

                <div id="mother" class="npc">
                    <div class="interact">!</div>
                    <div class="character">
                        <div class="hair"></div>
                        <div class="head"></div>
                        <div class="body"></div>
                    </div>
                </div>
            </div>

            <div id="living" class="room">
                <div id="sofa" class="object"></div>
                <div id="tv" class="object"></div>
            </div>

            <div id="door"></div>

        </div>

        <div id="hall"></div>

        <div id="player">
            <div class="character">
                <div class="head"></div>
                <div class="hair"></div>
                <div class="body"></div>
            </div>
        </div>

    </div>

    <div id="dialog">
        <div id="dialogName">Mutter</div>
        <div id="dialogText"></div>
        <button id="dialogButton" onclick="nextDialog()">Weiter</button>
    </div>

    <div id="controls">
        <button class="control" id="up">▲</button>
        <button class="control" id="left">◀</button>
        <button class="control" id="down">▼</button>
        <button class="control" id="right">▶</button>
    </div>

    <button id="action" onclick="action()">AKTION</button>

</div>

<script>

const player = document.getElementById("player");
const mother = document.getElementById("mother");

let x = 350;
let y = 470;

let speed = 5;

let gameStarted = false;

let keys = {
    up: false,
    down: false,
    left: false,
    right: false
};

let game = {
    minutes: 360,
    motivation: 50,
    talkedToMother: false
};

const dialogs = [
    "Leo! Steh auf! Du verpasst noch den Bus!",
    "Es ist schon sechs Uhr. Du musst dich langsam fertig machen.",
    "Hast du deinen Rucksack gepackt?",
    "Und denk an deine Mathearbeit heute.",
    "Na los, Frühstück steht auf dem Tisch.",
    "Du schaffst das. Vielleicht wird der Tag ja besser als du denkst."
];

let dialogIndex = 0;
let dialogOpen = false;

function startGame() {

    document.getElementById("startScreen").style.display = "none";

    gameStarted = true;

    setPosition();
    updateHUD();
}

function setPosition() {

    player.style.left = x + "px";
    player.style.top = y + "px";

    checkNPC();
}

function updateHUD() {

    let hours = Math.floor(game.minutes / 60);
    let minutes = game.minutes % 60;

    document.getElementById("time").textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0");

    document.getElementById("motivation").textContent =
        game.motivation;
}

function move(dx, dy) {

    if (!gameStarted || dialogOpen) return;

    x += dx;
    y += dy;

    // Grenzen der Welt
    x = Math.max(15, Math.min(1120, x));
    y = Math.max(15, Math.min(580, y));

    setPosition();

    game.minutes += 1;

    updateHUD();
}

function checkNPC() {

    let px = x + 23;
    let py = y + 30;

    let mx = 485 + 23;
    let my = 115 + 30;

    let distance =
        Math.sqrt(
            Math.pow(px - mx, 2) +
            Math.pow(py - my, 2)
        );

    if (distance < 90) {
        mother.classList.add("near");
    } else {
        mother.classList.remove("near");
    }
}

function action() {

    if (!gameStarted) return;

    let px = x + 23;
    let py = y + 30;

    let mx = 485 + 23;
    let my = 115 + 30;

    let distance =
        Math.sqrt(
            Math.pow(px - mx, 2) +
            Math.pow(py - my, 2)
        );

    if (distance < 100) {

        if (!dialogOpen) {
            openDialog();
        } else {
            nextDialog();
        }

    } else {

        // Türbereich
        if (x > 680 && y > 450) {

            document.getElementById("dialogName").textContent =
                "Leo";

            document.getElementById("dialogText").textContent =
                "Die Haustür ist noch geschlossen. Ich sollte erst mit Mama reden und mich fertig machen.";

            document.getElementById("dialog").style.display = "block";

            dialogOpen = true;
        }
    }
}

function openDialog() {

    dialogOpen = true;
    dialogIndex = 0;

    document.getElementById("dialog").style.display = "block";

    showDialog();
}

function showDialog() {

    document.getElementById("dialogName").textContent =
        "Mutter";

    document.getElementById("dialogText").textContent =
        dialogs[dialogIndex];

    document.getElementById("dialogButton").textContent =
        dialogIndex < dialogs.length - 1
        ? "Weiter"
        : "Schließen";
}

function nextDialog() {

    if (dialogIndex < dialogs.length - 1) {

        dialogIndex++;

        showDialog();

    } else {

        closeDialog();

        if (!game.talkedToMother) {

            game.talkedToMother = true;
            game.motivation += 10;

            updateHUD();
        }
    }
}

function closeDialog() {

    document.getElementById("dialog").style.display = "none";

    dialogOpen = false;
}

/* Tastatur */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        keys.up = true;
    }

    if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
        keys.down = true;
    }

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = true;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = true;
    }

    if (e.key === "e" || e.key === " ") {
        action();
    }
});

document.addEventListener("keyup", function(e) {

    if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        keys.up = false;
    }

    if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
        keys.down = false;
    }

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        keys.left = false;
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        keys.right = false;
    }
});

/* Bewegung */

setInterval(function() {

    if (!gameStarted || dialogOpen) return;

    if (keys.up) move(0, -speed);
    if (keys.down) move(0, speed);
    if (keys.left) move(-speed, 0);
    if (keys.right) move(speed, 0);

}, 30);

/* Handy-Steuerung */

function holdButton(id, direction) {

    const button = document.getElementById(id);

    button.addEventListener("touchstart", function(e) {
        e.preventDefault();
        keys[direction] = true;
    });

    button.addEventListener("touchend", function(e) {
        e.preventDefault();
        keys[direction] = false;
    });

    button.addEventListener("mousedown", function() {
        keys[direction] = true;
    });

    button.addEventListener("mouseup", function() {
        keys[direction] = false;
    });

    button.addEventListener("mouseleave", function() {
        keys[direction] = false;
    });
}

holdButton("up", "up");
holdButton("down", "down");
holdButton("left", "left");
holdButton("right", "right");

/* Mutter anklickbar */

mother.addEventListener("click", function() {

    if (!gameStarted) return;

    if (mother.classList.contains("near")) {
        action();
    }

});

/* Startposition */

setPosition();

</script>

</body>
</html>
